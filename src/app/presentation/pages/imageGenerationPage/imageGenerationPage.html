<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <app-chat-message text="What would you like to create?" />

      @for (message of messages(); track $index) {
        <!-- Is Gpt -->
        @if (message.isGpt) {
          <app-chat-message [text]="message.text" [imageInfo]="message.imageInfo" />
        }
        <!-- Is My Message -->
        @else {
          <app-my-message [text]="message.text" />
        }
      }
      <!-- Is Loading -->
      @if (isLoading()) {
        <app-typing-loader />
      }
    </div>
  </div>

  <app-text-message-box
    placeholder="Create an image about something..."
    (onMessage)="handleMessage($event)"
  />
</div>
