<div class="chat-container">
  <div class="chat-messages">
    <div class="gap-y-2 grid">
      <app-chat-message text="¿Qué deseas comparar?" />

      @for (message of messages(); track $index) { @if (message.isGpt) {
      <app-chat-message [text]="message.text" />
      } @else {
      <app-my-message [text]="message.text" />
      } } @if (isLoading()) { <app-typing-loader /> }
    </div>
  </div>

  <app-text-message-box placeholder="¿Qué deseas comparar?" (onMessage)="handleMessage($event)" />

  <!-- <app-text-message-box-file
    placeholder="What would you like to ask?"

  /> -->
