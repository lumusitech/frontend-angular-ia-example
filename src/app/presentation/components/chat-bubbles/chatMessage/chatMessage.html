<div class="col-start-1 col-end-9 p-3 rounded-lg">
  <div class="flex flex-row items-start">
    <div class="flex flex-shrink-0 justify-center items-center w-10 h-10 bg-green-600 rounded-full">
      G
    </div>

    <div class="relative px-4 pt-3 pb-2 ml-3 text-sm bg-black bg-opacity-25 rounded-xl shadow">
      <markdown [data]="text()"></markdown>

      <!-- Audio -->
      @if (audioUrl()) {
      <audio src="{{ audioUrl() }}" controls autoplay class="w-full"></audio>
      }
      <!-- Image -->
      @if (imageInfo()) {
      <img
        [src]="imageInfo()?.url"
        [alt]="imageInfo()?.alt"
        class="object-cover w-96 h-96 rounded-xl"
      />
      }
    </div>
  </div>
</div>
